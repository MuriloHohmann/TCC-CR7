<h3 style="color:black">Adicionar Usuário</h3>

<form action="/cadastroadm" method="POST">

    <div class="mb-3">

        <label style="color:black">Email</label>

        <input
        type="email"
        name="email"
        class="form-control"
        required>

    </div>

    <div class="mb-3">

        <select
        name="tipo"
        class="form-control">

            <option value="admin">admin</option>

    type="submit"
