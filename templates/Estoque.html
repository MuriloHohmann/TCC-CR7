<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Estoque</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="fundo-paginas-novas">

  <nav id="navbar2" class="navbar navbar-expand-lg" style="background-color: #192a6b;" data-bs-theme="dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#"></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="{{ url_for('login') }}">Página inicial</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('estoque') }}">Estoque</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    
    <h2 id="fonteestoque" class="mb-3 text-white">Estoque</h2>

    <table class="table table-bordered table-light">
      <thead>
        <tr style="background-color: #192a6b; color: rgb(255, 255, 255);">
          <th>ID</th>
          <th>Produto</th>
          <th>Categoria</th>
          <th>Quantidade</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        {% for mov in movimentacoes %}
        <tr>
          <td>{{ mov[0] }}</td>
          <td>{{ mov[2] }}</td>
          <td>{{ mov[3] }}</td>
          <td>{{ mov[4] }}</td>
          <td>{{ mov[5] }}</td>
          <td>{{ mov[6] }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>

  </div>

</body>
</html>
