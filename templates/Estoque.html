<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque - Almoxarifado</title>

    <!-- CSS do Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Seu CSS customizado -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="fundo-paginas-novas">

    <!-- NAVBAR NO TOPO -->
    <nav id="navbar" class="navbar navbar-expand-lg" style="background-color: #192a6b;" data-bs-theme="dark">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('login') }}">Anterior</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('movimentacoes') }}">Históricos de Movimentação</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="{{ url_for('estoque') }}">Estoque</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- CONTEÚDO PRINCIPAL -->
    <div class="container my-5">
        <div class="caixa-almoxarifado">
            
            <!-- Cabeçalho Centralizado -->
            <div class="header-container text-center mb-4">
                <img src="{{ url_for('static', filename='fundosenai.png.png') }}" alt="SENAI" class="logo-senai">
                <h1 class="titulo-almoxarifado text-center m-0">ALMOXARIFADO</h1>
            </div>

            <!-- Formulário Simplificado -->
            <form id="formAdicionarItem" class="row g-2 mb-4 align-items-end">
                <div class="col-md-4">
                    <label class="form-label fw-bold text-secondary mb-1 small">Nome</label>
                    <input type="text" id="nomeItem" class="form-control" placeholder="Ex: Parafuso" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold text-secondary mb-1 small">Descrição</label>
                    <input type="text" id="descItem" class="form-control" placeholder="Ex: M8 Inox" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold text-secondary mb-1 small">Qtd</label>
                    <input type="number" id="qtdItem" class="form-control" placeholder="0" required>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100 fw-bold">Adicionar</button>
                </div>
            </form>

            <!-- Tabela Simples -->
            <div class="table-responsive">
                <table class="table tabela-simples mb-0" id="tabelaEstoque">
                    <thead>
                        <tr>
                            <th scope="col">Código</th>
                            <th scope="col">Nome</th>
                            <th scope="col">Descrição</th>
                            <th scope="col">Quantidade</th>
                            <th scope="col" style="width: 100px;">Ação</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>1</td>
                            <td>teste</td>
                            <td>teste</td>
                            <td>119</td>
                            <td><button class="btn btn-outline-danger btn-sm btn-remover">Remover</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <!-- JS do Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Seu Script JS externo -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
